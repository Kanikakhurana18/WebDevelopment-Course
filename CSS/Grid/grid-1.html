<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <style>
    .container{
      width: 90vw;
      height: 100vh;
      border: 2px solid blue;
      display: grid;
      /* grid-template-columns:[first] 120px [second]100px [third];
      grid-template-rows: 100px 100px 100px; */
      /* grid-template-columns: 1fr 2fr 1fr ; 1/3 fraction & 2/3 fraction */

      /* grid-template-columns: repeat(4,1fr); */

      /* grid-template-columns: repeat(4,minmax(100px, 1fr)); */

      grid-template-columns: repeat(2,80px);
      justify-content: center;
      grid-template-rows: repeat(2,80px);
      align-content: center;
      place-content: center; /*Used for both justify content and align content*/
      /* gap: 3px; */
      row-gap: 10px;
      column-gap: 44px;
      justify-items:  center;
      align-items: center;
    }
    .items{
      border: 2px solid red;
      height: 55px;
      width: 55px;
    }
    .item-4{
      /* grid-row: 1/2;  OR*/
      grid-row-start: 1;
      grid-row-end: 2;
      grid-column: first/third;
    }
    .item1{ /*overlapps items 1 and 4*/
      grid-row: 1/2;
      grid-column: 1/2;
    }
  </style>
</head>
<body>
  <div class="container">
  <div class="items item1">1</div>
  <div class="items">2</div>
  <div class="items">3</div>
  <div class="items item-4 ">4</div>
  <div class="items">5</div>
  </div>
</body>
</html>
