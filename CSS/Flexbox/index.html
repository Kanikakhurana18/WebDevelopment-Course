<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
    .container{
      border: 2px solid red;
      display:  flex;
      height: 80vh;
      /* justify-content: center; */
      align-items: center;
      /* flex-direction: column; */
      flex-wrap: wrap;
      /* align-content: flex-start; */
      /* there is no justify items in flexbox */
      flex-flow: row wrap;
      /* column-gap: 60px;
      row-gap: 10px; */
      gap: 10px 60px; /*row column*/

    }
    .item{
      /* flex-grow: 1; */
      height: 50px;
      width: 50px;
      background-color: blueviolet;
      border: 2px solid black;
      /* margin: 5px; */
    }
    .order-1{
      order: 1;
    }
     .order-2{
      order: 2;
    }
     .order-3{
      order: 3;
    }
    .item1{
      /* flex-grow: 3; */
      flex-shrink: 2;
      align-self: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item item1">1</div>
    <div class="item order-1">2</div>
    <div class="item">3</div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
