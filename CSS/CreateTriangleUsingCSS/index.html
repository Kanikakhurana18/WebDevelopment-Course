<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating triangle using CSS</title>
  <style>
    .triangle{
      width: 0px;
      /* if we take width and height 100px then it will be square or box */
      height: 0px;
      border-left: 50px solid magenta;
      border-top: 50px solid transparent;
      border-bottom: 50px solid transparent; 
      /* Jis border ko color doge, triangle usi direction me point karega. also maan lo right side bnanho to usko chod kr baki sb direction provide karo */
    } 

  </style>
</head>
<body>
  <div class="triangle"></div>
</body>
</html>
