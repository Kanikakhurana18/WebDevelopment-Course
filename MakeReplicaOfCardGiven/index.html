<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Replica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        body{
            background-color: gainsboro;
        }
        .box {
            border: 1px solid lightgrey;
            width: 320px;
            margin: auto;
            padding: 9px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 10px;
            height: 200px;
            object-fit: cover;
        }

        .tags {
            display: flex;
            /*Flexbox ka purpose hai layout banana.*/
            gap: 10px;
            margin-bottom: 5px;
        }

        .tag {
            border: 1px solid lightgray;
            border-radius: 30px;
            padding: 4px 8px;
            color: gray;
        }

        h2 {
            font-size: 30px;
            margin-top: 15px;
        }

        p {
            color: grey;
            line-height: 1.3;
            font-family: "Poppins", sans-serif;
        }

        button {
            background-color: #d8ebff;
            color: #2680ff;
            border: none;
            padding: 12px 25px;
            border-radius: 999px;
            cursor: pointer;
        }

        .button-box {
            text-align: center;
            margin-bottom: 5px;
        }

        button:hover {
            background-color: #2680ff;
            color: white;
        }
    </style>
</head>

<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card. Use #html -->
    <div class="box">
        <div>

            <img class="img"
                src="https://thumbs.dreamstime.com/b/spring-summer-landscape-blue-sky-clouds-river-boat-green-trees-narew-countryside-grass-poland-water-leaves-58070004.jpg?w=768"
                alt="River">
        </div>

        <div class="tags">
            <span class="tag">Nature</span>
            <span class="tag">Lake</span>
        </div>

        <h2>Lago di Braies</h2>

        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Hic porro sunt quae delectus corporis quo quidem
            modi nemo cum eveniet tenetur, itaque officia facere, doloribus architecto.</p>

        <div class="button-box">
            <button>Read more</button>
        </div>
    </div>
</body>

</html>
